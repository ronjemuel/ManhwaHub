<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1400" viewBox="0 0 900 1400"><rect width="900" height="1400" fill="#11151a"/><text x="450" y="350.0" text-anchor="middle" font-family="sans-serif" font-size="16" letter-spacing="5" fill="#b9e888">MANHWAHUB ORIGINALS · CHAPTER 1</text><text x="450" y="448.0" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="30" fill="#f1f2f3">AFTER THE LAST TRAIN</text><text x="450" y="700.0" text-anchor="middle" fill="#dae0e2" font-family="sans-serif" font-size="29">The station clock had stopped at eleven.</text><text x="450" y="762.0" text-anchor="middle" fill="#dae0e2" font-family="sans-serif" font-size="29">Lio had been waiting for years.</text><text x="450" y="824.0" text-anchor="middle" fill="#dae0e2" font-family="sans-serif" font-size="29">Tonight, another traveler arrived.</text><path d="M415 1220h70" stroke="#b9e888" stroke-width="2"/><text x="450" y="1280" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#8a959e">Original demo story · sample chapter</text></svg>